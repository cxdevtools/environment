name: Release environment

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'release' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build release ZIP
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as 1.2.3 or v1.2.3." >&2
            exit 1
          fi
          ./gradlew releaseZip -PreleaseVersion="$version"
      - name: Publish release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="build/release/environment-$version.zip"

          if [[ "$GITHUB_EVENT_NAME" == "release" ]] || gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            flags=()
            if [[ "$version" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag \
              --title "Release $version" --notes-file RELEASE_NOTES.md "${flags[@]}"
          fi
